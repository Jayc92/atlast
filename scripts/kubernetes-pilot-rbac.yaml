# M6-A/M6-B read-only RBAC manifest (ADR-0037 §§ 1-2, ADR-0039 § 4; accepted
# docs/m6-plan.md § 8, Option B). Grants exactly get/list/watch on Pods,
# Services, Deployments, and ReplicaSets, in exactly one namespace, to a
# dedicated ServiceAccount — never the ambient/default kubeconfig context.
# No wildcard verb, no wildcard resource, no ClusterRole, no write verb.
# M6-A originally scoped this Role to Pods only; M6-B adds Services (core)
# and Deployments/ReplicaSets (apps) additively, per ADR-0039 § 4's exact
# text — the mechanism is unchanged, only the Role's own resource list grew.
#
# This manifest is a documented prerequisite the tester explicitly applies
# themselves (kubectl apply -f), before running scripts/connect-kubernetes-pilot.sh
# — it is never applied automatically by that script. Edit the two
# `atlast-m6-a` namespace references below if your disposable cluster uses a
# different namespace name; nothing else needs to change.
apiVersion: v1
kind: Namespace
metadata:
  name: atlast-m6-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlast-m6-a-discovery
  namespace: atlast-m6-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlast-m6-a-pod-reader
  namespace: atlast-m6-a
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlast-m6-a-pod-reader-binding
  namespace: atlast-m6-a
subjects:
  - kind: ServiceAccount
    name: atlast-m6-a-discovery
    namespace: atlast-m6-a
roleRef:
  kind: Role
  name: atlast-m6-a-pod-reader
  apiGroup: rbac.authorization.k8s.io
